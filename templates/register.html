<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <form action="{{url_for('auth.register')}}" method="post">
    <input type="text" name="login" placeholder="Enter login"><p></p>
    <input type="password" name="password" placeholder="Enter password"><p></p>
    <input type="password" name="password2" placeholder="Confirm password"><p></p>
    <button>Register</button>
    </form><p></p>
    <button onclick="window.location.href='/login'">Login</button>
    {%with flash=get_flashed_messages()%}
    {%for i in flash%}
    {{i}}
    {%endfor%}
    {%endwith%}
</body>
</html>
